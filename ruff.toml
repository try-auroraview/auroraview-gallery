# Ruff configuration for the Gallery Python host.
#
# line-length matches try-auroraview/auroraview so the migrated code keeps its
# existing formatting instead of being reflowed on extraction.

line-length = 100
target-version = "py311"

[lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[lint.per-file-ignores]
"__init__.py" = ["F401", "E402", "I001"]

[lint.isort]
known-first-party = ["backend"]
